<style>
:root{--bg:#0d0d10;--panel:rgba(27,26,23,.86);--panel2:rgba(37,34,27,.82);--text:#f5f2e9;--muted:#aaa596;--line:rgba(255,231,170,.11);--accent:#a78bfa;--accent2:#7c6cf0;--shadow:0 18px 55px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;transition:background .25s,color .25s}
body.light{--bg:#f3f2f9;--panel:rgba(255,255,255,.88);--panel2:rgba(246,244,252,.92);--text:#222033;--muted:#77748b;--line:rgba(30,25,55,.12);--shadow:0 18px 55px rgba(40,30,80,.10)}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 12% 0%,rgba(124,108,240,.10),transparent 42%),radial-gradient(ellipse at 88% 100%,rgba(224,174,55,.17),transparent 43%),linear-gradient(180deg,#0b0b0f 0%,#101012 53%,#19160e 100%)}
body.custom-bg:after{content:"";position:fixed;inset:0;z-index:-1;background:var(--wallpaper) center/cover no-repeat;opacity:.22;pointer-events:none}
button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 14px;transition:.18s}button:hover{border-color:var(--accent);transform:translateY(-1px)}button.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));border:0;color:white;font-weight:700}button.danger{color:#ff9baf}input,select,textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:90px}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}.app{display:none;min-height:100vh}.app.ready{display:block}
.loader{position:fixed;inset:0;display:grid;place-items:center;background:#0b0b0f;color:#f4f2ff;z-index:20;transition:opacity .25s}.loader.hide{opacity:0;pointer-events:none}.load-inner{text-align:center;animation:loadReveal .65s ease both}.brandmark{width:54px;height:54px;margin:0 auto 16px;border-radius:18px;background:linear-gradient(135deg,#7c6cf0,#c4a7ff);display:grid;place-items:center;font-size:25px;font-weight:900;box-shadow:0 8px 35px #8b75ff55}.load-title{letter-spacing:.34em;font-size:22px;font-weight:850;color:#f7f1df}.leaf-x{display:block;width:76px;height:46px;margin:12px auto 4px;filter:drop-shadow(0 0 9px rgba(236,190,79,.34))}.leaf-x path{fill:url(#leafGold);stroke:#f5d77c;stroke-width:1.15;stroke-linejoin:round}.load-sub{color:#aaa6c4;font-size:12px;margin-top:8px}.bar{height:3px;width:170px;background:#ffffff20;border-radius:9px;margin:22px auto 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b98a2e,#ffe59a);border-radius:9px;animation:loadProgress 3.5s linear forwards}@keyframes loadProgress{to{width:100%}}@keyframes loadReveal{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:var(--panel);backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:.18em}.mini-mark{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,#7c6cf0,#c4a7ff);display:grid;place-items:center;color:white;font-weight:900}.top-actions{display:flex;gap:8px;align-items:center}.glass-icon-btn{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:15px;border:1px solid rgba(255,218,112,.34);background:linear-gradient(145deg,rgba(255,224,130,.20),rgba(255,255,255,.045));box-shadow:inset 0 1px 1px rgba(255,255,255,.28),0 5px 18px rgba(255,190,55,.10);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#ffd45f}.glass-icon-btn svg{width:23px;height:23px;filter:drop-shadow(0 0 5px rgba(255,207,82,.38))}.glass-icon-btn:hover{border-color:rgba(255,218,112,.72);background:linear-gradient(145deg,rgba(255,224,130,.29),rgba(255,255,255,.08))}.glass-icon-btn:active{transform:scale(.96)}.mode-label-icon{display:inline-flex;vertical-align:middle;width:18px;height:18px;margin-left:4px;color:#e7b93f}.mode-label-icon svg{width:100%;height:100%}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1400px;margin:auto;min-height:calc(100vh - 70px)}aside{padding:22px 14px;border-right:1px solid var(--line)}.nav-label{font-size:10px;letter-spacing:.16em;color:var(--muted);padding:8px 10px}.nav{width:100%;display:flex;align-items:center;gap:11px;text-align:left;background:transparent;border-color:transparent;margin:3px 0}.nav.active{background:rgba(157,133,255,.13);border-color:#a78bfa40;color:var(--accent)}main{padding:28px;min-width:0}.welcome{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.18em;font-weight:800}.welcome h1{font-size:clamp(25px,4vw,36px);margin:5px 0 2px;letter-spacing:-.04em}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(14px);min-width:0}.stat{font-size:27px;font-weight:800;margin-top:8px}.card h3{margin:0 0 5px;font-size:15px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}.section-head h2{font-size:18px;margin:0}.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0}.stack{display:grid;gap:12px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);margin-top:8px}.item small{color:var(--muted)}.item-actions{display:flex;gap:6px;flex-wrap:wrap}.item-actions button{padding:7px 9px;font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.form-grid .wide{grid-column:1/-1}.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:13px}.swatches{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.swatch{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid #ffffff55}.preview{border:1px solid var(--line);border-left:4px solid var(--embed-color,var(--accent));background:var(--panel2);border-radius:12px;padding:15px;overflow:hidden}.preview img{max-width:100%;max-height:230px;object-fit:contain;border-radius:9px;display:block;margin-top:10px}.thumb{width:65px;height:65px;object-fit:cover;float:right;border-radius:8px;margin-left:10px}.field{padding:8px;background:rgba(120,120,150,.09);border-radius:8px;margin-top:8px}.field b{display:block}.hidden{display:none!important}.hint{font-size:12px;color:var(--muted)}.footer-note{font-size:11px;color:var(--muted);margin-top:20px}.mobile-menu{display:none}#main a{font-size:13px;text-decoration:none}#main a:hover{text-decoration:underline}
.ai-hero{display:flex;align-items:center;gap:13px;padding:16px;border:1px solid rgba(255,211,104,.22);border-radius:16px;background:linear-gradient(130deg,rgba(255,255,255,.035),rgba(225,177,67,.075));margin-bottom:14px}.ai-face{font-size:22px;font-weight:900;color:#ffe08a;background:#17150f;border:1px solid rgba(255,215,120,.3);border-radius:13px;padding:10px 12px;box-shadow:0 0 20px rgba(238,190,74,.10)}.ai-chat{display:grid;gap:10px}.ai-messages{display:flex;flex-direction:column;gap:9px;max-height:340px;overflow:auto;padding:13px;background:rgba(0,0,0,.17);border:1px solid var(--line);border-radius:14px}.ai-msg{white-space:pre-wrap;line-height:1.55;padding:11px 13px;border-radius:12px;max-width:94%;font-size:13px}.ai-msg.bot{align-self:flex-start;background:rgba(190,153,69,.10);border:1px solid rgba(255,215,120,.15)}.ai-msg.user{align-self:flex-end;background:rgba(124,108,240,.16);border:1px solid rgba(167,139,250,.22)}.ai-shortcuts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.ai-shortcuts button{font-size:12px;padding:8px 10px}.ai-compose{display:flex;gap:8px}.ai-compose input{min-width:0}.ai-compose button{white-space:nowrap}
@media(max-width:760px){.layout{display:block}aside{display:none;position:fixed;z-index:8;top:70px;bottom:0;left:0;width:245px;max-height:calc(100dvh - 70px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;background:var(--bg);box-shadow:var(--shadow)}aside.open{display:block}.mobile-menu{display:inline-flex}main{padding:20px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.welcome{align-items:start;flex-direction:column}.top{padding:0 13px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}}
@media(max-width:390px){.grid{grid-template-columns:1fr}.top-actions button{padding:8px}.brand{letter-spacing:.12em}}
</style>
</head>
<body>
<div class="loader" id="loader" role="status" aria-label="Loading AETHER"><div class="load-inner"><div class="brandmark">A</div><div class="load-title">AETHER</div><svg class="leaf-x" viewBox="0 0 100 60" aria-label="Two golden leaves crossed in an X" role="img"><defs><linearGradient id="leafGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0ae"/><stop offset=".48" stop-color="#e5bd58"/><stop offset="1" stop-color="#9e7024"/></linearGradient></defs><path d="M12 8 C31 5 44 15 50 29 C36 33 19 27 12 8 Z M50 29 C38 25 27 17 17 10"/><path d="M88 8 C69 5 56 15 50 29 C64 33 81 27 88 8 Z M50 29 C62 25 73 17 83 10" transform="translate(100 0) scale(-1 1)"/></svg><div class="load-sub">Your space. Your control.</div><div class="bar"><i></i></div></div></div>
<div class="app" id="app">
<header class="top"><div class="row"><button class="mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><div class="brand"><span class="mini-mark">A</span>AETHER</div></div><div class="top-actions"><button class="glass-icon-btn" id="themeBtn" title="Toggle day/night" aria-label="Toggle day/night"></button><button id="quickBgBtn" title="Change background">🖼️</button></div></header>
<div class="layout">
<aside id="sidebar"><div class="nav-label">WORKSPACE</div>
<button class="nav active" data-page="home">⌂ <span>Overview</span></button>
<button class="nav" data-page="channels">▤ <span>Channels</span></button>
<button class="nav" data-page="roles">◇ <span>Roles</span></button>
<button class="nav" data-page="members">♙ <span>Members</span></button>
<div class="nav-label">DISCORD STUDIO</div><button class="nav" data-page="assistant">[ :D ] <span>Bob · Discord AI</span></button><button class="nav" data-page="embeds">▣ <span>Embed Studio</span></button><div class="nav-label">ROBLOX DIVISION</div><button class="nav" data-page="roblox">◇ <span>Roblox Studio</span></button><button class="nav" data-page="robloxAssets">▧ <span>Roblox Assets</span></button><div class="nav-label">CREATOR STUDIO</div><button class="nav" data-page="creator">✧ <span>AI Image Studio</span></button><button class="nav" data-page="vault">▣ <span>Asset Vault</span></button><button class="nav" data-page="bio">✦ <span>Bio & Profile</span></button>
<div class="nav-label">PREFERENCES</div><button class="nav" data-page="appearance">◐ <span>Appearance</span></button><button class="nav" data-page="settings">⚙ <span>Settings</span></button>

<main id="main"></main>
</div></div>
<input type="file" id="bgPicker" accept="image/*" hidden>
<input type="file" id="embedImagePicker" accept="image/*" hidden>
<script>
(()=>{'use strict';
const KEY='aether_workspace_v1';
const defaults={theme:'dark',accent:'#a78bfa',workspace:'My AETHER Space',bio:'Building something awesome.',background:'',channels:[{id:1,name:'general',type:'Text'},{id:2,name:'announcements',type:'Announcements'}],roles:[{id:1,name:'Admin',color:'#a78bfa'}],members:[{id:1,name:'You',role:'Admin'}]};
let state;
try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state={...defaults}}
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const modeIcon=mode=>mode==='sun'
?'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.2v2.1M12 19.7v2.1M4.9 4.9l1.5 1.5m11.2 11.2 1.5 1.5M2.2 12h2.1m15.4 0h2.1M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19.2 15.4A8.2 8.2 0 0 1 8.6 4.8 8.4 8.4 0 1 0 19.2 15.4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m16.8 4.1.45 1.25 1.25.45-1.25.45-.45 1.25-.45-1.25-1.25-.45 1.25-.45.45-1.25Z" fill="currentColor"/></svg>';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Storage is full. Try a smaller background image.')}} 
function apply(){document.body.classList.toggle('light',state.theme==='light');document.documentElement.style.setProperty('--accent',state.accent);document.documentElement.style.setProperty('--accent2',state.accent);if(state.background){document.body.classList.add('custom-bg');document.body.style.setProperty('--wallpaper',`url("${state.background}")`)}else{document.body.classList.remove('custom-bg');document.body.style.removeProperty('--wallpaper')}$('#themeBtn').innerHTML=modeIcon(state.theme==='dark'?'sun':'moon');$('#themeBtn').title=state.theme==='dark'?'Switch to day mode':'Switch to night mode';$('#themeBtn').setAttribute('aria-label',$('#themeBtn').title)}
let page='home';
const pages={home:home,channels:channels,roles:roles,members:members,assistant:assistant,roblox:roblox,robloxAssets:robloxAssets,creator:creator,vault:vault,embeds:embeds,bio:bio,appearance:appearance,settings:settings};
function go(p){page=p;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');render()}
function render(){(pages[page]||home)()}
function head(kicker,title,desc=''){return `<div class="welcome"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><div class="muted">${desc}</div></div></div>`}
function home(){let h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';$('#main').innerHTML=head('YOUR WORKSPACE',`${g}, welcome back 👋`,'Everything you need, in one calm little space.')+`<div class="grid"><div class="card"><div class="muted">Channels</div><div class="stat">${state.channels.length}</div></div><div class="card"><div class="muted">Roles</div><div class="stat">${state.roles.length}</div></div><div class="card"><div class="muted">Members</div><div class="stat">${state.members.length}</div></div></div><div class="section-head"><h2>Quick access</h2></div><div class="grid"><div class="card"><h3>▤ Channels</h3><p class="muted">Organize your spaces.</p><button onclick="A.go('channels')">Open channels</button></div><div class="card"><h3>🤖 Bob · Discord AI</h3><p class="muted">Your Discord server-building advisor.</p><button onclick="A.go('assistant')">Chat with Bob</button></div><div class="card"><h3>🎮 Boburg · Roblox AI</h3><p class="muted">Plan Roblox games, maps and mechanics.</p><button onclick="A.go('roblox')">Chat with Boburg</button></div><div class="card"><h3>▣ Embed Studio</h3><p class="muted">Create a custom Discord embed.</p><button onclick="A.go('embeds')">Create embed</button></div><div class="card"><h3>✧ AI Image Studio</h3><p class="muted">Prepare artwork prompts for Roblox and Discord.</p><button onclick="A.go('creator')">Open Creator Studio</button></div><div class="card"><h3>◐ Appearance</h3><p class="muted">Make AETHER feel like yours.</p><button onclick="A.go('appearance')">Customize</button></div></div>`}
function listPage(title,desc,items,kind){let html=head('WORKSPACE',title,desc)+`<div class="card"><div class="row"><input id="newName" placeholder="New ${kind.slice(0,-1)} name"><select id="newType" style="max-width:170px">${kind==='channels'?'<option>Text</option><option>Voice</option><option>Announcements</option><option>Forum</option>':'<option>General</option>'}</select><button class="primary" id="addBtn">Add</button></div><div id="items">${items.length?items.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><br><small>${kind==='channels'?esc(x.type):kind==='roles'?`Role · ${esc(x.color)}`:`Role: ${esc(x.role||'None')}`}</small></div><div class="item-actions"><button data-edit="${x.id}">Rename</button>${kind==='members'?`<button data-role="${x.id}">Role</button>`:''}<button class="danger" data-del="${x.id}">Delete</button></div></div>`).join(''):'<div class="empty">Nothing here yet. Add your first one above.</div>'}</div></div>`;$('#main').innerHTML=html;
$('#addBtn').onclick=()=>{let n=$('#newName').value.trim();if(!n)return alert('Enter a name first.');let id=Date.now();if(kind==='channels')state.channels.push({id,name:n,type:$('#newType').value});if(kind==='roles')state.roles.push({id,name:n,color:state.accent});if(kind==='members')state.members.push({id,name:n,role:state.roles[0]?.name||'None'});save();render()};
$('#items').onclick=e=>{let b=e.target.closest('button');if(!b)return;let id=Number(b.dataset.edit||b.dataset.del||b.dataset.role);let arr=state[kind],x=arr.find(v=>v.id===id);if(b.dataset.del){if(confirm('Delete this item?')){state[kind]=arr.filter(v=>v.id!==id);save();render()}}else if(b.dataset.edit){let n=prompt('New name:',x.name);if(n?.trim()){x.name=n.trim();save();render()}}else if(b.dataset.role){let choices=state.roles.map(r=>r.name);if(!choices.length)return alert('Create a role first.');let r=prompt('Type a role name:\\n'+choices.join(', '),x.role);if(r){x.role=r;save();render()}}}
}
function assistant(){
$('#main').innerHTML=head('DISCORD STUDIO','Bob','Your Discord server-building advisor.')+`<div class="ai-hero"><div class="ai-face">[ :D ]</div><div><b>Hey! I'm Bob, your Discord AI.</b><div class="muted">Tell me what kind of Discord server you're creating. I'll ask follow-up questions and help choose channels, roles, permissions and more.</div></div></div><div class="card ai-chat"><div class="section-head" style="margin:0"><h2>Chat with Bob</h2><span class="hint">Built-in · works offline</span></div><div class="ai-shortcuts"><button data-ai="Help me choose channels">Channels</button><button data-ai="Help me choose roles">Roles</button><button data-ai="Help me organize categories">Categories</button><button data-ai="Help me write rules">Rules</button><button data-ai="What should I set up next?">What's next?</button></div><div class="ai-messages" id="aiMessages" aria-live="polite"><div class="ai-msg bot"><b>BOB · DISCORD AI</b><br>Let's build your server together! First, what is your server about? For example: friends, gaming, study, anime, creators, business or a general community.</div></div><form class="ai-compose" id="aiForm"><input id="aiInput" placeholder="Tell me your idea or ask what to pick..." autocomplete="off"><button class="primary" type="submit">Send ↗</button></form></div>`;
const box=$('#aiMessages'),inp=$('#aiInput');let serverType='',accessType='',vibe='',chosenChannels='',chosenRoles='',chosenRules=false,chosenWelcome=false;
function say(t,who){let d=document.createElement('div');d.className='ai-msg '+who;d.textContent=t;box.appendChild(d);box.scrollTop=box.scrollHeight}
function detectType(x){let types=[['gaming',/gaming|games? server|gamer|esports|game community/],['friends',/friends?|personal group|private group/],['study',/study|school|college|class|homework|education/],['anime',/anime|manga|otaku/],['creator',/creator|youtube|stream|content|artist|portfolio/],['business',/business|work|team|company|professional/],['support',/support server|help desk|customer support/],['roleplay',/role.?play|rp server/],['music',/music|band|dj|singer/],['art',/art server|drawing|design community/],['tech',/technology|coding|programming|developer/],['fan',/fan server|fandom|fans of/],['community',/community|social|public|general server/]];for(let [n,re] of types)if(re.test(x))return n;return ''}
function channelIdeas(){let extra={gaming:'🎮 GAME SPACE\n#game-chat · #looking-for-group · #clips · #game-news',friends:'✨ FRIENDS\n#daily-chat · #photos · #plans · #memes',study:'📚 STUDY\n#study-chat · #resources · #questions · #study-room',anime:'🍥 ANIME & MANGA\n#anime-chat · #manga · #recommendations · #fan-art',creator:'🎨 CREATOR SPACE\n#work-in-progress · #showcase · #collabs · #updates',business:'💼 TEAM SPACE\n#projects · #updates · #resources · #meeting-notes',support:'🛟 SUPPORT\n#open-a-ticket · #common-questions · #known-issues · #feedback',roleplay:'🎭 ROLEPLAY\n#character-sheets · #roleplay-chat · #lore · #plot-ideas',music:'🎵 MUSIC\n#music-chat · #song-sharing · #new-releases · #collabs',art:'🖌️ ART\n#art-chat · #showcase · #feedback · #resources',tech:'💻 TECH\n#coding-chat · #help-and-debugging · #projects · #resources',fan:'⭐ FAN COMMUNITY\n#fan-chat · #news · #theories · #fan-art',community:'🌍 COMMUNITY\n#introductions · #events · #off-topic · #suggestions'};let start=accessType==='private'?'📌 START HERE\n#welcome · #announcements':'📌 START HERE\n#welcome · #rules · #announcements';let common='💬 COMMUNITY\n#general · #introductions\n\n🛠️ HELP & FEEDBACK\n#help · #suggestions\n\n🔒 STAFF (private)\n#staff-chat · #mod-logs';return `${start}\n\n${extra[serverType]||'🌟 YOUR TOPIC\n#topic-chat · #sharing · #events'}\n\n${common}`}
function roleIdeas(){let member=({gaming:'Gamer',study:'Student',anime:'Fan',creator:'Creator',business:'Team Member',support:'Customer',roleplay:'Roleplayer',music:'Listener',art:'Artist',tech:'Developer',fan:'Fan',friends:'Friend'})[serverType]||'Member';return `👑 Owner — full control\n🛡️ Admin — trusted server management\n🔨 Moderator — keep the community safe\n🤝 Helper — answer questions and welcome people\n⭐ ${member} — regular member\n🤖 Bots — integrations`}
function answer(q){let x=q.toLowerCase(),t=detectType(x);
if(/^(reset|start over|restart)( the setup)?$/.test(x)){serverType=accessType=vibe=chosenChannels=chosenRoles='';chosenRules=chosenWelcome=false;return `Fresh start! 💛 First, what is your server about? You can describe it in your own words.`}
if(t){serverType=t;return `Nice — a ${t} server! 💛\n\nMy next question: is it **private** (invite-only) or **public** (anyone can join)?`}
if(/private|invite.?only|friends only/.test(x)){accessType='private';return `Private it is. I'd keep the main area welcoming but make staff tools and logs private.\n\nNext, what vibe do you want: **clean/minimal**, **aesthetic**, **fun**, or **professional**?`}
if(/public|open|anyone can join|everyone can join/.test(x)){accessType='public';return `Public community — got it. I'd make the welcome, rules and help channels easy to find so newcomers know where to start.\n\nWhat vibe should it have: **clean/minimal**, **aesthetic**, **fun**, or **professional**?`}
if(/minimal|clean|simple/.test(x)){vibe='clean/minimal';return `Clean and minimal — great choice. I'll avoid clutter and keep only useful channels.\n\nI'd choose the channel layout next. Want my recommended channels?`}
if(/aesthetic|pretty|cozy|soft/.test(x)){vibe='aesthetic';return `Aesthetic it is ✨ I'd use tidy categories, short channel names and a consistent theme.\n\nLet's pick your channels next — want my recommended layout?`}
if(/professional|formal|businesslike/.test(x)){vibe='professional';return `Professional style selected. I'll keep names clear, categories structured and permissions sensible.\n\nLet's choose your channels next. Want my recommended layout?`}
if(/fun|chaotic|casual|chill/.test(x)){vibe='fun';return `Fun and casual — got it 😎 I'll make room for chat, media and events without overcrowding the server.\n\nReady for my channel recommendations?`}
if(/channel/.test(x)){if(!serverType)return `First, tell me what the server is about. It can be gaming, friends, study, anime, creators, business, support, roleplay, music, art, tech or something else.`;chosenChannels=channelIdeas();return `For your ${serverType} ${accessType||''} server, I'd pick these channels${vibe?` with a ${vibe} feel`:''}:\n\n${chosenChannels}\n\n**Why this layout?** It gives members an obvious starting point, keeps topic chat together and separates staff discussions. Keep or change anything?`}
if(/role|permission|staff|admin/.test(x)){if(!serverType)return `I can recommend roles, but first: what is your server about?`;chosenRoles=roleIdeas();return `I'd choose this role order for your ${serverType} server:\n\n${chosenRoles}\n\n**My advice:** only the Owner should have full control. Give Admin and Moderator only the permissions they actually need. Want to keep these roles or rename any?`}
if(/categor|organ|group/.test(x)){if(!serverType)return `Sure! What is your server about? I'll organize categories around its purpose.`;return `I'd use these categories:\n\n📌 START HERE\n💬 COMMUNITY\n⭐ ${serverType.toUpperCase()} SPACE\n🛠️ HELP & FEEDBACK\n🔒 STAFF (private)\n\nThis keeps the server easy to navigate. Next I can fill each category with channels.`}
if(/rule|guideline/.test(x)){chosenRules=true;return `I'd start with these rules:\n\n1. Be respectful — no harassment or hate.\n2. No spam or disruptive behaviour.\n3. Use the correct channels.\n4. No scams, malicious links or impersonation.\n5. Respect everyone's privacy.\n6. Follow Discord's Terms and Community Guidelines.\n7. Listen to the moderation team.\n\nI'd keep rules short and easy to understand. Should the tone be friendly, strict or professional?`}
if(/welcome|greet/.test(x)){chosenWelcome=true;return `I'd use this welcome message:\n\n👋 Welcome to ${serverType?`our ${serverType} server`:'our community'}!\n\nWe're glad you're here. Start by reading #rules, check #announcements, and introduce yourself in #general. Be kind, get involved and enjoy your stay!\n\nWant it more fun, aesthetic or professional?`}
if(/moder|safety|protect|automod/.test(x))return `For a safe setup, I'd recommend:\n\n• Enable Discord AutoMod for spam and harmful words.\n• Keep a private #mod-logs channel.\n• Limit Administrator permission to the owner and very trusted admins.\n• Set clear rules and a way to report problems.\n\nNext, would you like a **basic** or **advanced** moderation setup?`;
if(/next|what should|what now|pick|choose|recommend|suggest|you decide/.test(x)){if(!serverType)return `I'll guide you one choice at a time. First, what is your server about?`;if(!accessType)return `Next I'd decide who can join: **private/invite-only** or **public/anyone can join**?`;if(!vibe)return `Next I'd choose the style: **clean/minimal**, **aesthetic**, **fun**, or **professional**. Which sounds right?`;if(!chosenChannels)return `Next, I'd set up channels. For your ${serverType} server, say **suggest channels** and I'll build the layout.`;if(!chosenRoles)return `Your channel plan is ready. Next I'd set up roles and permissions. Say **suggest roles** and I'll recommend a safe role order.`;if(!chosenRules)return `Roles are planned! Next I'd write the server rules so members know what's expected. Want me to draft them?`;if(!chosenWelcome)return `Rules are ready. Next I'd create a welcome message for new members. Want one?`;return `Your starter plan is coming together! 💛\n\n• Type: ${serverType}\n• Access: ${accessType}\n• Style: ${vibe}\n• Channels: planned\n• Roles: planned\n• Rules: drafted\n• Welcome: drafted\n\nI'd finish by checking permissions, AutoMod and staff-only channels. Want that checklist?`}
return `Tell me what you're deciding — server type, privacy, style, channels, roles, permissions, rules or welcome message. You can also say **“what should I pick next?”** and I'll guide you from where we are.`}
function send(q){q=q.trim();if(!q)return;say(q,'user');say(answer(q),'bot');inp.value='';inp.focus()}
$('#aiForm').onsubmit=e=>{e.preventDefault();send(inp.value)};document.querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>send(b.dataset.ai));
}
function roblox(){
$('#main').innerHTML=head('ROBLOX STUDIO','Boburg','Your Roblox game-planning and building assistant.')+`<div class="ai-hero"><div class="ai-face">B</div><div><b>Hey! I'm Boburg, your Roblox AI.</b><div class="muted">I can help plan game concepts, maps, worlds, mechanics, progression and Roblox Lua scripts. Tell me what you want to create.</div></div></div><div class="card ai-chat"><div class="section-head" style="margin:0"><h2>Chat with Boburg</h2><span class="hint">Built-in · works offline</span></div><div class="ai-shortcuts"><button data-roblox="Help me choose a Roblox game idea">Game ideas</button><button data-roblox="Help me design a map">Map design</button><button data-roblox="Suggest game mechanics">Mechanics</button><button data-roblox="Help me with a Roblox Lua script">Lua scripts</button><button data-roblox="What should I build next?">What's next?</button></div><div class="ai-messages" id="robloxMessages" aria-live="polite"><div class="ai-msg bot"><b>BOBURG · ROBLOX AI</b><br>Let's create something! What kind of Roblox game are you imagining — obby, simulator, tycoon, roleplay, horror, adventure, PvP, or something original?</div></div><form class="ai-compose" id="robloxForm"><input id="robloxInput" placeholder="Tell Boburg your Roblox game idea..." autocomplete="off"><button class="primary" type="submit">Send ↗</button></form></div><p class="footer-note">Boburg provides planning and example code offline. To build or publish the actual game, use Roblox Studio and review/test generated scripts there.</p>`;
const box=$('#robloxMessages'),inp=$('#robloxInput');let genre='',map='',mechanics='';
function say(t,who){let d=document.createElement('div');d.className='ai-msg '+who;d.textContent=t;box.appendChild(d);box.scrollTop=box.scrollHeight}
function reply(q){let x=q.toLowerCase();if(/obby|simulator|tycoon|role.?play|horror|adventure|pvp|battle|racing|story/.test(x)){genre=(x.match(/obby|simulator|tycoon|role.?play|horror|adventure|pvp|battle|racing|story/)||['original'])[0];return `Nice choice — a ${genre} game! 🎮\n\nWhat setting should it have? For example: floating islands, city, space station, haunted school, tropical island, fantasy kingdom or futuristic lab. I'll shape the map around that.`}if(/island|city|space|school|kingdom|lab|map|world|setting/.test(x)){map=q;return `Here's a map direction based on that: **${q}**\n\nI'd split it into a safe spawn area, a central landmark, 3–5 exploration zones, a reward area and a secret/bonus location.\n\nNext, what should players mainly do — explore, build, collect, survive, race, fight or complete quests?`}if(/explore|build|collect|survive|race|fight|quest|mechanic/.test(x)){mechanics=q;return `Great. For the main gameplay (${q}), I'd build a simple loop:\n\n1. Give players a clear first objective.\n2. Let them earn coins/XP or unlock progress.\n3. Add upgrades or new areas as rewards.\n4. Save progress safely on the server with DataStoreService when you implement it.\n\nWant me to draft a feature list or a starter Roblox Lua example?`}if(/lua|script|code/.test(x))return `I can draft a starter Lua example. A good first script is a checkpoint, coin pickup, door trigger or simple round timer.\n\nWhich one do you want? I'll explain where it belongs in Roblox Studio and what to test. Remember to review scripts before using them.`;if(/next|what should|recommend|pick|choose|suggest/.test(x)){if(!genre)return 'First, pick a game type: obby, simulator, tycoon, roleplay, horror, adventure, PvP, racing or your own idea.';if(!map)return `You've chosen ${genre}. Next, choose the game's setting — what world should players explore?`;if(!mechanics)return 'Next, choose the main player activity: explore, build, collect, survive, race, fight or complete quests.';return 'Your game concept is taking shape! I can now help create a map zone plan, feature list, progression system or starter Lua example. Which should we design first?'}return 'Tell me your game idea, genre, map setting, gameplay loop or the Roblox script you need. I can help you plan it step by step.'}
function send(q){q=q.trim();if(!q)return;say(q,'user');say(reply(q),'bot');inp.value='';inp.focus()}$('#robloxForm').onsubmit=e=>{e.preventDefault();send(inp.value)};document.querySelectorAll('[data-roblox]').forEach(b=>b.onclick=()=>send(b.dataset.roblox));
}

const DB='aether_asset_vault', STORE='assets';
function openVaultDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(Error('IndexedDB unavailable'));let req=indexedDB.open(DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function vault(){
$('#main').innerHTML=head('CREATOR STUDIO','Asset Vault','Keep your own images and artwork references together on this device.')+`<div class="card"><h3>Add an asset</h3><p class="muted">Choose an image from your phone. Assets stay in this browser on this device.</p><input id="vaultFile" type="file" accept="image/*"><p class="hint">For smooth performance, use images under 2 MB each.</p></div><div class="section-head"><h2>Your saved assets</h2><span class="hint" id="vaultCount">Loading...</span></div><div class="grid" id="vaultGrid"></div>`;
const grid=$('#vaultGrid');let urls=[];function clean(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[]}async function refresh(){clean();try{let db=await openVaultDB(),items=await new Promise((res,rej)=>{let q=db.transaction(STORE).objectStore(STORE).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});$('#vaultCount').textContent=items.length+' saved';grid.innerHTML=items.length?items.map(x=>{let u=URL.createObjectURL(x.blob);urls.push(u);return `<div class="card"><img src="${u}" alt="${esc(x.name)}" loading="lazy" style="width:100%;height:130px;object-fit:cover;border-radius:10px"><b>${esc(x.name)}</b><div class="hint">${(x.blob.size/1024).toFixed(0)} KB</div><div class="row" style="margin-top:9px"><a href="${u}" download="${esc(x.name)}" style="color:var(--accent)">Download</a><button class="danger" data-remove="${x.id}">Delete</button></div></div>`}).join(''):'<div class="empty" style="grid-column:1/-1">Your vault is empty. Add your first image above.</div>';grid.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{let d=await openVaultDB();d.transaction(STORE,'readwrite').objectStore(STORE).delete(Number(b.dataset.remove));refresh()})}catch(e){$('#vaultCount').textContent='Unavailable';grid.innerHTML='<div class="empty">Your browser does not support local asset storage.</div>'}}
$('#vaultFile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('Choose an image file.');if(f.size>2*1024*1024)return alert('Choose an image under 2 MB to keep AETHER light.');try{let d=await openVaultDB();d.transaction(STORE,'readwrite').objectStore(STORE).add({name:f.name,blob:f,created:Date.now()});e.target.value='';refresh()}catch(err){alert('Could not save this image in your browser storage.')}};refresh()
}
